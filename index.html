
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente de Operaciones - Candidate Evaluation</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #f5f2ed;
            font-family: 'Bitter', serif;
            color: #2c2c2c;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        .header h1 {
            font-size: 42px;
            color: #9c523d;
            margin-bottom: 8px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        
        .header p {
            font-size: 14px;
            color: #81a1ab;
            letter-spacing: 1px;
        }
        
        .nav-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid #d4c5b9;
            margin-bottom: 30px;
        }
        
        .nav-tab {
            padding: 12px 0;
            border: none;
            background: none;
            font-family: 'Bitter', serif;
            font-size: 14px;
            letter-spacing: 1px;
            color: #999;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .nav-tab.active {
            color: #9c523d;
            border-bottom-color: #9c523d;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 20px;
            margin-bottom: 40px;
            padding: 20px;
            background: white;
            border-radius: 2px;
        }
        
        .controls input, .controls select {
            padding: 12px;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            font-family: 'Bitter', serif;
            font-size: 13px;
        }
        
        .controls label {
            display: block;
            font-size: 11px;
            color: #999;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        
        .btn-export {
            padding: 12px 20px;
            background: #81a1ab;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 13px;
            letter-spacing: 1px;
            align-self: flex-end;
        }
        
        .btn-export:hover {
            background: #6d8b96;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .candidate-card {
            background: white;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
        }
        
        .candidate-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            transform: translateY(-4px);
        }
        
        .card-photo {
            width: 100%;
            height: 280px;
            background: linear-gradient(135deg, #e6cd87 0%, #dd9973 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: rgba(255,255,255,0.3);
            overflow: hidden;
        }
        
        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-content {
            padding: 24px;
        }
        
        .card-name {
            font-size: 18px;
            font-weight: 700;
            color: #9c523d;
            margin-bottom: 8px;
        }
        
        .card-position {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }
        
        .card-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid #eee;
            margin-bottom: 12px;
        }
        
        .score-number {
            font-size: 28px;
            font-weight: 700;
            color: #81a1ab;
        }
        
        .score-label {
            font-size: 11px;
            color: #999;
        }
        
        .card-round {
            display: inline-block;
            padding: 6px 12px;
            background: #f5f2ed;
            border-radius: 2px;
            font-size: 11px;
            color: #2c2c2c;
            margin-bottom: 12px;
        }
        
        .card-round.final { background: #d4e8de; color: #2d6a4f; }
        .card-round.round2 { background: #fef3c7; color: #92400e; }
        .card-round.round1 { background: #dbeafe; color: #0c4a6e; }
        
        .candidate-form {
            background: white;
            padding: 30px;
            border-radius: 2px;
            margin-bottom: 30px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-row.full {
            grid-template-columns: 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            font-size: 11px;
            color: #999;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        
        .form-group input {
            padding: 12px;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            font-family: 'Bitter', serif;
            font-size: 13px;
        }
        
        .btn-add {
            padding: 12px 24px;
            background: #9c523d;
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        
        .btn-add:hover {
            background: #7d4230;
        }
        
        .candidates-table {
            background: white;
            border-radius: 2px;
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .candidates-table th {
            background: #f5f2ed;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #2c2c2c;
            border-bottom: 1px solid #d4c5b9;
        }
        
        .candidates-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .candidates-table tr:hover {
            background: #f9f7f5;
        }
        
        .btn-small {
            padding: 6px 12px;
            background: white;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 12px;
            margin-right: 6px;
        }
        
        .btn-small:hover {
            background: #f5f2ed;
            border-color: #9c523d;
        }
        
        .btn-delete {
            padding: 6px 12px;
            background: #f5e8e3;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            cursor: pointer;
            font-size: 11px;
            color: #9c523d;
        }
        
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 2px;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            position: relative;
        }
        
        .modal-title {
            font-size: 28px;
            color: #9c523d;
            margin-bottom: 30px;
        }
        
        .detail-section {
            margin-bottom: 30px;
        }
        
        .detail-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        
        .detail-value {
            font-size: 14px;
            color: #2c2c2c;
        }
        
        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }
        
        .btn-secondary {
            padding: 12px;
            background: white;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 13px;
        }
        
        .btn-primary {
            padding: 12px;
            background: #9c523d;
            color: white;
            border: 1px solid #9c523d;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 13px;
        }
        
        .btn-primary:hover {
            background: #7d4230;
        }
        
        .rating-section {
            margin-bottom: 30px;
        }
        
        .rating-label {
            font-size: 13px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 12px;
            display: block;
        }
        
        .rating-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        
        .rating-btn {
            padding: 12px;
            background: #f5f2ed;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Bitter', serif;
            font-size: 14px;
            font-weight: 600;
        }
        
        .rating-btn.active {
            background: #9c523d;
            color: white;
            border-color: #9c523d;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            font-family: 'Bitter', serif;
            font-size: 13px;
            resize: vertical;
            min-height: 80px;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f5f2ed;
            border: 1px solid #d4c5b9;
            border-radius: 2px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo svg {
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 10 C30 15, 25 40, 35 55 C40 65, 60 65, 65 55 C75 40, 70 15, 50 10" fill="#9c523d" opacity="0.8"/>
            </svg>
        </div>
        
        <div class="header">
            <h1>GERENTE DE OPERACIONES</h1>
            <p>CASA LAS TORTUGAS — CANDIDATE EVALUATION</p>
        </div>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('evaluate')">EVALUATE</button>
            <button class="nav-tab" onclick="switchTab('candidates')">MANAGE CANDIDATES</button>
        </div>
        
        <div id="evaluate-tab" class="tab-content active">
            <div class="controls">
                <div>
                    <label>Your Name</label>
                    <input type="text" id="raterName" placeholder="e.g., María, Juan">
                </div>
                <div>
                    <label>Filter by Round</label>
                    <select id="roundFilter">
                        <option value="all">All Candidates</option>
                        <option value="round1">Round 1 (3.0+)</option>
                        <option value="round2">Round 2 (4.0+)</option>
                        <option value="final">Final Round (4.5+)</option>
                    </select>
                </div>
                <button class="btn-export" onclick="exportCSV()">EXPORT CSV</button>
            </div>
            <div class="cards-grid" id="cardsGrid"></div>
        </div>
        
        <div id="candidates-tab" class="tab-content">
            <div class="candidate-form">
                <h2 style="font-size: 20px; color: #9c523d; margin-bottom: 20px;">ADD NEW CANDIDATE</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Candidate Name</label>
                        <input type="text" id="form-name" placeholder="e.g., María García">
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <input type="text" id="form-position" placeholder="e.g., Front Office Manager">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="form-phone" placeholder="+52-998-XXXXXX">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="form-email" placeholder="email@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Years Boutique Experience</label>
                        <input type="text" id="form-experience" placeholder="e.g., 5 years">
                    </div>
                    <div class="form-group">
                        <label>PMS Systems</label>
                        <input type="text" id="form-pms" placeholder="e.g., Opera, Micros">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Availability</label>
                        <input type="text" id="form-availability" placeholder="e.g., Immediate, 2 weeks">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Upload Profile Picture (JPG/PNG)</label>
                        <input type="file" id="form-photo" accept=".jpg,.jpeg,.png">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Upload CV (PDF)</label>
                        <input type="file" id="form-cv" accept=".pdf">
                    </div>
                </div>
                <button class="btn-add" onclick="addCandidate()">+ ADD CANDIDATE</button>
            </div>
            
            <div>
                <table class="candidates-table">
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Name</th>
                            <th>Position</th>
                            <th>Email</th>
                            <th>Experience</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="candidatesList"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Edit Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeEditModal()">✕</button>
            <div class="modal-title">Edit Candidate</div>
            <div id="editFormContent"></div>
        </div>
    </div>
    
    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDetailModal()">✕</button>
            <div id="detailContent"></div>
        </div>
    </div>
    
    <!-- Rating Modal -->
    <div class="modal" id="ratingModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeRatingModal()">✕</button>
            <div class="modal-title" id="modalCandidateName"></div>
            <div id="ratingsContainer"></div>
            <textarea id="comments" placeholder="Comments..."></textarea>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeRatingModal()">Cancel</button>
                <button class="btn-primary" onclick="saveRatingHandler()">Save Rating</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDNzqc4jZOl5LStJkAQkwL3kwPgNf5vScU",
          authDomain: "casa-las-tortugas-candidates.firebaseapp.com",
          projectId: "casa-las-tortugas-candidates",
          storageBucket: "casa-las-tortugas-candidates.firebasestorage.app",
          messagingSenderId: "944487796645",
          appId: "1:944487796645:web:a741565ab36236c0d9a24c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const competencies = [
            { id: 'boutique', label: 'Boutique Ops' },
            { id: 'english', label: 'English' },
            { id: 'housekeeping', label: 'Housekeeping' },
            { id: 'pms', label: 'PMS/Tech' },
            { id: 'leadership', label: 'Leadership' },
            { id: 'service', label: 'Service' },
            { id: 'problem', label: 'Problem-solving' },
            { id: 'budget', label: 'Budget Control' }
        ];

        let candidates = [];
        let ratings = {};
        let currentCandidateId = null;

        async function uploadFile(file, folder, name) {
            if (!file) return null;
            try {
                const ext = file.type.includes('pdf') ? 'pdf' : 'jpg';
                const fileName = `${name}_${Date.now()}.${ext}`;
                const storageRef = ref(storage, `${folder}/${fileName}`);
                await uploadBytes(storageRef, file);
                return await getDownloadURL(storageRef);
            } catch (error) {
                console.error(`Error uploading:`, error);
                alert(`Error uploading file`);
                return null;
            }
        }

        function loadData() {
            onSnapshot(query(collection(db, "candidates")), (snapshot) => {
                candidates = snapshot.docs.map(doc => ({
                    ...doc.data(),
                    docId: doc.id
                })).sort((a, b) => a.id - b.id);
                renderCards();
                renderCandidatesList();
            });

            onSnapshot(query(collection(db, "ratings")), (snapshot) => {
                ratings = {};
                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    ratings[`${data.candidateId}-${data.raterName}`] = data;
                });
                renderCards();
            });
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        };

        window.addCandidate = async function() {
            const name = document.getElementById('form-name').value.trim();
            if (!name) {
                alert('Please enter candidate name');
                return;
            }

            const photoFile = document.getElementById('form-photo').files[0];
            const cvFile = document.getElementById('form-cv').files[0];
            
            let photoUrl = photoFile ? await uploadFile(photoFile, 'photos', name) : null;
            let cvUrl = cvFile ? await uploadFile(cvFile, 'cvs', name) : null;

            await addDoc(collection(db, "candidates"), {
                id: Math.max(...candidates.map(c => c.id), 0) + 1,
                name,
                position: document.getElementById('form-position').value.trim(),
                phone: document.getElementById('form-phone').value.trim(),
                email: document.getElementById('form-email').value.trim(),
                experience: document.getElementById('form-experience').value.trim(),
                pms: document.getElementById('form-pms').value.trim(),
                availability: document.getElementById('form-availability').value.trim(),
                photoUrl,
                cvUrl
            });

            document.getElementById('form-name').value = '';
            document.getElementById('form-position').value = '';
            document.getElementById('form-phone').value = '';
            document.getElementById('form-email').value = '';
            document.getElementById('form-experience').value = '';
            document.getElementById('form-pms').value = '';
            document.getElementById('form-availability').value = '';
            document.getElementById('form-photo').value = '';
            document.getElementById('form-cv').value = '';
        };

        window.deleteCandidate = async function(docId) {
            if (confirm('Delete this candidate?')) {
                await deleteDoc(doc(db, "candidates", docId));
            }
        };

        window.editCandidate = function(candidateId) {
            const candidate = candidates.find(c => c.id === candidateId);
            if (!candidate) return;

            const html = `
                <div class="form-row">
                    <div class="form-group">
                        <label>Candidate Name</label>
                        <input type="text" id="edit-name" value="${candidate.name}">
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <input type="text" id="edit-position" value="${candidate.position || ''}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="edit-phone" value="${candidate.phone || ''}">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="edit-email" value="${candidate.email || ''}">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Years Boutique Experience</label>
                        <input type="text" id="edit-experience" value="${candidate.experience || ''}">
                    </div>
                    <div class="form-group">
                        <label>PMS Systems</label>
                        <input type="text" id="edit-pms" value="${candidate.pms || ''}">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Availability</label>
                        <input type="text" id="edit-availability" value="${candidate.availability || ''}">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Upload New Profile Picture (JPG/PNG)</label>
                        <input type="file" id="edit-photo" accept=".jpg,.jpeg,.png">
                        ${candidate.photoUrl ? `<small style="color: #999; margin-top: 6px;">Current photo exists - upload new one to replace</small>` : ''}
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Upload New CV (PDF)</label>
                        <input type="file" id="edit-cv" accept=".pdf">
                        ${candidate.cvUrl ? `<small style="color: #999; margin-top: 6px;">Current CV exists - upload new one to replace</small>` : ''}
                    </div>
                </div>
                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button class="btn-primary" onclick="saveEditedCandidate(${candidateId}, '${candidate.docId}')">Save Changes</button>
                </div>
            `;
            
            document.getElementById('editFormContent').innerHTML = html;
            document.getElementById('editModal').classList.add('active');
        };

        window.saveEditedCandidate = async function(candidateId, docId) {
            const name = document.getElementById('edit-name').value.trim();
            if (!name) {
                alert('Please enter candidate name');
                return;
            }

            const photoFile = document.getElementById('edit-photo').files[0];
            const cvFile = document.getElementById('edit-cv').files[0];
            
            let photoUrl = null;
            let cvUrl = null;

            if (photoFile) {
                photoUrl = await uploadFile(photoFile, 'photos', name);
            }

            if (cvFile) {
                cvUrl = await uploadFile(cvFile, 'cvs', name);
            }

            const updateData = {
                name,
                position: document.getElementById('edit-position').value.trim(),
                phone: document.getElementById('edit-phone').value.trim(),
                email: document.getElementById('edit-email').value.trim(),
                experience: document.getElementById('edit-experience').value.trim(),
                pms: document.getElementById('edit-pms').value.trim(),
                availability: document.getElementById('edit-availability').value.trim()
            };

            if (photoUrl) updateData.photoUrl = photoUrl;
            if (cvUrl) updateData.cvUrl = cvUrl;

            await updateDoc(doc(db, "candidates", docId), updateData);

            closeEditModal();
        };

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.remove('active');
        };

        window.showDetail = function(candidateId) {
            const candidate = candidates.find(c => c.id === candidateId);
            if (!candidate) return;

            const html = `
                <div class="modal-title">${candidate.name}</div>
                
                ${candidate.photoUrl ? `<div style="text-align: center; margin-bottom: 30px;"><img src="${candidate.photoUrl}" style="width: 200px; height: 200px; border-radius: 8px; object-fit: cover;"></div>` : ''}
                
                <div class="detail-section">
                    <div class="detail-label">Position</div>
                    <div class="detail-value">${candidate.position || '—'}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Email</div>
                    <div class="detail-value">${candidate.email || '—'}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Phone</div>
                    <div class="detail-value">${candidate.phone || '—'}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Boutique Hotel Experience</div>
                    <div class="detail-value">${candidate.experience || '—'}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">PMS Systems</div>
                    <div class="detail-value">${candidate.pms || '—'}</div>
                </div>
                
                <div class="detail-section">
                    <div class="detail-label">Availability</div>
                    <div class="detail-value">${candidate.availability || '—'}</div>
                </div>
                
                ${candidate.cvUrl ? `
                    <div class="detail-section">
                        <a href="${candidate.cvUrl}" target="_blank" style="color: #9c523d; font-size: 14px; text-decoration: none;">📄 Download CV</a>
                    </div>
                ` : ''}
                
                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="closeDetailModal()">Close</button>
                </div>
            `;
            
            document.getElementById('detailContent').innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
        };

        window.closeDetailModal = function() {
            document.getElementById('detailModal').classList.remove('active');
        };

        function renderCandidatesList() {
            const tbody = document.getElementById('candidatesList');
            tbody.innerHTML = candidates.map(c => `
                <tr>
                    <td style="text-align: center;">${c.photoUrl ? `<img src="${c.photoUrl}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">` : '—'}</td>
                    <td>${c.name}</td>
                    <td>${c.position || '—'}</td>
                    <td>${c.email || '—'}</td>
                    <td>${c.experience || '—'}</td>
                    <td>
                        <button class="btn-small" onclick="showDetail(${c.id})">View</button>
                        <button class="btn-small" onclick="editCandidate(${c.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteCandidate('${c.docId}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            candidates.forEach(candidate => {
                const score = getScore(candidate.id);
                const round = score ? (score.avg >= 4.5 ? 'Final' : score.avg >= 4.0 ? 'Round 2' : 'Round 1') : 'Not Rated';
                const roundClass = round === 'Final' ? 'final' : round === 'Round 2' ? 'round2' : 'round1';

                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <div class="card-photo" onclick="showDetail(${candidate.id})" style="cursor: pointer;">
                        ${candidate.photoUrl ? `<img src="${candidate.photoUrl}" alt="${candidate.name}">` : '👤'}
                    </div>
                    <div class="card-content">
                        <div class="card-name" onclick="showDetail(${candidate.id})" style="cursor: pointer;">${candidate.name}</div>
                        <div class="card-position">${candidate.position}</div>
                        ${score ? `
                            <div class="card-round ${roundClass}">${round}</div>
                            <div class="card-score">
                                <div style="flex: 1;">
                                    <div class="score-number">${score.avg.toFixed(1)}</div>
                                    <div class="score-label">Score</div>
                                </div>
                                <div class="score-label">${score.count} ratings</div>
                            </div>
                        ` : `<div class="card-round">Not Rated</div>`}
                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee;">
                            <button class="btn-small" onclick="openRatingModal(${candidate.id})">+ RATE</button>
                            <button class="btn-small" onclick="showDetail(${candidate.id})">INFO</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function getScore(candidateId) {
            const ratingsList = Object.values(ratings)
                .filter(r => r.candidateId === candidateId);

            if (ratingsList.length === 0) return null;

            let total = 0, count = 0;
            ratingsList.forEach(r => {
                Object.values(r.scores).forEach(score => {
                    if (score > 0) { total += score; count++; }
                });
            });

            return { avg: total / count, count: ratingsList.length };
        }

        window.openRatingModal = function(candidateId) {
            const raterName = document.getElementById('raterName').value.trim();
            if (!raterName) {
                alert('Please enter your name');
                return;
            }

            currentCandidateId = candidateId;
            const candidate = candidates.find(c => c.id === candidateId);
            document.getElementById('modalCandidateName').textContent = candidate.name;

            const container = document.getElementById('ratingsContainer');
            container.innerHTML = '';

            competencies.forEach(comp => {
                const section = document.createElement('div');
                section.className = 'rating-section';
                section.innerHTML = `
                    <label class="rating-label">${comp.label}</label>
                    <div class="rating-buttons">
                        ${[1, 2, 3, 4, 5].map(i => `
                            <button class="rating-btn" onclick="setRating('${comp.id}', ${i})">${i}</button>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });

            document.getElementById('ratingModal').classList.add('active');
        };

        window.setRating = function(competencyId, value) {
            document.querySelectorAll(`button[onclick*="${competencyId}"]`).forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        };

        window.saveRatingHandler = async function() {
            const raterName = document.getElementById('raterName').value;
            const scores = {};
            let hasScores = false;

            competencies.forEach(comp => {
                const activeBtn = document.querySelector(`button.active[onclick*="${comp.id}"]`);
                if (activeBtn) {
                    scores[comp.id] = parseInt(activeBtn.textContent);
                    hasScores = true;
                }
            });

            if (!hasScores) {
                alert('Please rate at least one competency');
                return;
            }

            await addDoc(collection(db, "ratings"), {
                candidateId: currentCandidateId,
                raterName,
                scores,
                comments: document.getElementById('comments').value,
                date: new Date().toLocaleDateString()
            });

            closeRatingModal();
        };

        window.closeRatingModal = function() {
            document.getElementById('ratingModal').classList.remove('active');
            document.getElementById('comments').value = '';
            currentCandidateId = null;
        };

        window.exportCSV = function() {
            let csv = 'Candidate,Score,Round\n';
            candidates.forEach(c => {
                const score = getScore(c.id);
                const round = score ? (score.avg >= 4.5 ? 'Final' : score.avg >= 4.0 ? 'Round 2' : 'Round 1') : 'Not Rated';
                csv += `${c.name},${score ? score.avg.toFixed(1) : 'N/A'},${round}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'candidates.csv';
            a.click();
        };

        loadData();
    </script>
</body>
</html>
