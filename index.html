
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Las Tortugas - Candidate Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #f5f2ed 0%, #faf8f5 100%);
            font-family: 'Bitter', serif; 
            color: #2c2c2c; 
            padding: 40px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-text { font-size: 48px; font-weight: 700; color: #e6cd87; letter-spacing: 8px; text-shadow: 2px 2px 4px rgba(156, 82, 61, 0.2); }
        .logo-year { font-size: 14px; color: #9c523d; margin-top: 8px; letter-spacing: 2px; }
        .header { text-align: center; margin-bottom: 50px; border-bottom: 2px solid #e6cd87; padding-bottom: 30px; }
        .header h1 { font-size: 48px; color: #9c523d; margin-bottom: 12px; font-weight: 400; letter-spacing: 3px; }
        .header p { font-size: 14px; color: #81a1ab; letter-spacing: 2px; }
        .back-link { margin-bottom: 30px; }
        .back-link a { color: #9c523d; text-decoration: none; font-size: 13px; letter-spacing: 1px; }
        .back-link a:hover { text-decoration: underline; }

        /* Vacancies Grid */
        .vacancies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .vacancy-card { background: white; border-radius: 4px; padding: 40px; text-align: center; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); transition: all 0.3s ease; border: 1px solid #f0e8e0; cursor: pointer; }
        .vacancy-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.15); transform: translateY(-4px); }
        .vacancy-icon { font-size: 48px; margin-bottom: 20px; }
        .vacancy-title { font-size: 22px; color: #9c523d; font-weight: 700; margin-bottom: 16px; }
        .vacancy-count { font-size: 48px; color: #e6cd87; font-weight: 700; margin: 24px 0; }
        .vacancy-label { font-size: 12px; color: #999; letter-spacing: 1px; margin-bottom: 24px; }
        .vacancy-btn { padding: 12px 24px; background: #9c523d; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 13px; letter-spacing: 1px; font-weight: 600; transition: all 0.3s ease; }
        .vacancy-btn:hover { background: #7d4230; }

        /* Candidates Grid */
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .candidate-card { background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); transition: all 0.3s ease; border: 1px solid #f0e8e0; position: relative; }
        .candidate-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.15); transform: translateY(-4px); }
        .card-photo { width: 100%; height: 200px; background: linear-gradient(135deg, #e6cd87 0%, #dd9973 100%); display: flex; align-items: center; justify-content: center; font-size: 60px; position: relative; }
        .experience-badge { position: absolute; top: 12px; right: 12px; background: #9c523d; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .card-content { padding: 24px; }
        .card-name { font-size: 18px; font-weight: 700; color: #9c523d; margin-bottom: 12px; }
        .card-detail { font-size: 12px; color: #999; margin-bottom: 8px; }
        .card-detail strong { color: #2c2c2c; }

        .loading { text-align: center; padding: 40px; font-size: 16px; color: #999; }
        .error { color: #d32f2f; padding: 20px; background: #ffebee; border-radius: 4px; margin: 20px 0; }
        .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-text">CLT</div>
            <div class="logo-year">1998</div>
        </div>
        
        <div class="header">
            <h1 id="pageTitle">CASA LAS TORTUGAS</h1>
            <p id="pageSubtitle">RECRUITMENT DASHBOARD</p>
        </div>
        
        <div id="backLinkContainer" class="back-link" style="display: none;">
            <a href="/" onclick="router(); return false;">← Volver a vacantes</a>
        </div>
        
        <div id="mainContent">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <!-- Firebase 8.x -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        let db;
        let currentPath = window.location.pathname;

        const firebaseConfig = {
            apiKey: "AIzaSyDNzqc4jZOl5LStJkAQkwL3kwPgNf5vScU",
            authDomain: "casa-las-tortugas-candidates.firebaseapp.com",
            projectId: "casa-las-tortugas-candidates",
            storageBucket: "casa-las-tortugas-candidates.firebasestorage.app",
            messagingSenderId: "944487796645",
            appId: "1:944487796645:web:a741565ab36236c0d9a24c"
        };

        const vacancies = [
            { slug: 'gerente-operativo', name: 'Gerente Operativo', icon: '👔' },
            { slug: 'recepcionista', name: 'Recepcionista', icon: '📞' },
            { slug: 'ama-de-llaves', name: 'Ama de Llaves', icon: '🏠' }
        ];

        function initFirebase() {
            if (typeof firebase === 'undefined') {
                setTimeout(initFirebase, 100);
                return;
            }

            try {
                if (firebase.apps.length === 0) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                console.log('✓ Firebase initialized');
                router();
            } catch (e) {
                console.error('Firebase error:', e);
            }
        }

        function router() {
            currentPath = window.location.pathname;
            console.log('Route:', currentPath);

            document.getElementById('backLinkContainer').style.display = 'none';
            document.getElementById('pageTitle').textContent = 'CASA LAS TORTUGAS';
            document.getElementById('pageSubtitle').textContent = 'RECRUITMENT DASHBOARD';

            // Match /dashboard/[slug]
            const match = currentPath.match(/\/dashboard\/([a-z-]+)/);
            
            if (match) {
                const slug = match[1];
                loadVacancyDashboard(slug);
                document.getElementById('backLinkContainer').style.display = 'block';
            } else {
                loadMasterDashboard();
            }
        }

        async function loadMasterDashboard() {
            try {
                console.log('Loading master dashboard...');
                const mainContent = document.getElementById('mainContent');
                let html = '<div class="vacancies-grid">';

                for (const vacancy of vacancies) {
                    try {
                        const snapshot = await db.collection('candidates')
                            .where('vacante', '==', vacancy.slug)
                            .get();
                        const count = snapshot.size;

                        html += `
                            <div class="vacancy-card" onclick="window.location.href='/dashboard/${vacancy.slug}'">
                                <div class="vacancy-icon">${vacancy.icon}</div>
                                <div class="vacancy-title">${vacancy.name}</div>
                                <div class="vacancy-count">${count}</div>
                                <div class="vacancy-label">candidatos en proceso</div>
                                <button class="vacancy-btn">Abrir dashboard</button>
                            </div>
                        `;
                    } catch (error) {
                        console.error(`Error loading ${vacancy.slug}:`, error);
                    }
                }

                html += '</div>';
                mainContent.innerHTML = html;
            } catch (error) {
                document.getElementById('mainContent').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function loadVacancyDashboard(slug) {
            try {
                console.log(`Loading vacancy dashboard: ${slug}`);
                
                const vacancy = vacancies.find(v => v.slug === slug);
                if (!vacancy) {
                    document.getElementById('mainContent').innerHTML = '<div class="error">Vacante no encontrada</div>';
                    return;
                }

                document.getElementById('pageTitle').textContent = vacancy.name.toUpperCase();
                document.getElementById('pageSubtitle').textContent = 'CASA LAS TORTUGAS — CANDIDATE EVALUATION';

                const mainContent = document.getElementById('mainContent');
                const snapshot = await db.collection('candidates')
                    .where('vacante', '==', slug)
                    .get();

                if (snapshot.empty) {
                    mainContent.innerHTML = '<div class="empty">No hay candidatos para esta vacante</div>';
                    return;
                }

                let html = '<div class="candidates-grid">';

                snapshot.forEach(doc => {
                    const candidate = doc.data();
                    const experience = candidate.experience || 0;

                    html += `
                        <div class="candidate-card">
                            <div class="card-photo">
                                ${candidate.name.charAt(0).toUpperCase()}
                                <div class="experience-badge">${experience}y</div>
                            </div>
                            <div class="card-content">
                                <div class="card-name">${candidate.name}</div>
                                <div class="card-detail"><strong>Email:</strong> ${candidate.email || 'N/A'}</div>
                                <div class="card-detail"><strong>Teléfono:</strong> ${candidate.phone || 'N/A'}</div>
                                <div class="card-detail"><strong>PMS:</strong> ${candidate.pms || 'N/A'}</div>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                mainContent.innerHTML = html;
                console.log(`✓ Loaded ${snapshot.size} candidates`);

            } catch (error) {
                console.error('Error loading vacancy:', error);
                document.getElementById('mainContent').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // Initialize
        console.log('App starting...');
        initFirebase();

        // Handle browser back/forward
        window.addEventListener('popstate', router);
    </script>
</body>
</html>
