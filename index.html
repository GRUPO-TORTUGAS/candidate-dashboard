
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Las Tortugas - Recruitment Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #f5f2ed 0%, #faf8f5 100%);
            font-family: 'Bitter', serif; 
            color: #2c2c2c; 
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-text { font-size: 48px; font-weight: 700; color: #e6cd87; letter-spacing: 8px; }
        .logo-year { font-size: 14px; color: #9c523d; margin-top: 8px; letter-spacing: 2px; }
        .header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid #e6cd87; padding-bottom: 30px; }
        .header h1 { font-size: 40px; color: #9c523d; margin-bottom: 8px; font-weight: 400; letter-spacing: 2px; }
        .header p { font-size: 13px; color: #81a1ab; letter-spacing: 1px; }
        .back-link { margin-bottom: 20px; }
        .back-link a { color: #9c523d; text-decoration: none; font-size: 13px; letter-spacing: 1px; }
        .back-link a:hover { text-decoration: underline; }

        /* Vacancies Grid */
        .vacancies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .vacancy-card { background: white; border-radius: 4px; padding: 35px; text-align: center; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); transition: all 0.3s ease; border: 1px solid #f0e8e0; cursor: pointer; }
        .vacancy-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.15); transform: translateY(-4px); }
        .vacancy-icon { font-size: 44px; margin-bottom: 16px; }
        .vacancy-title { font-size: 20px; color: #9c523d; font-weight: 700; margin-bottom: 14px; }
        .vacancy-count { font-size: 44px; color: #e6cd87; font-weight: 700; margin: 18px 0; }
        .vacancy-label { font-size: 12px; color: #999; margin-bottom: 20px; }
        .vacancy-btn { padding: 11px 22px; background: #9c523d; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 12px; letter-spacing: 1px; font-weight: 600; }
        .vacancy-btn:hover { background: #7d4230; }

        /* Tabs */
        .nav-tabs { display: flex; gap: 30px; border-bottom: 2px solid #e6cd87; margin-bottom: 30px; }
        .nav-tab { padding: 12px 0; border: none; background: none; font-family: 'Bitter', serif; font-size: 13px; letter-spacing: 1px; color: #999; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-tab:hover { color: #9c523d; }
        .nav-tab.active { color: #9c523d; border-bottom-color: #e6cd87; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Candidates Grid */
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .candidate-card { background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); transition: all 0.3s ease; border: 1px solid #f0e8e0; position: relative; cursor: pointer; }
        .candidate-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.15); transform: translateY(-4px); }
        .card-photo { width: 100%; height: 160px; background: linear-gradient(135deg, #e6cd87 0%, #dd9973 100%); display: flex; align-items: center; justify-content: center; font-size: 48px; position: relative; overflow: hidden; }
        .card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .experience-badge { position: absolute; top: 10px; right: 10px; background: #9c523d; color: white; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
        .card-content { padding: 18px; }
        .card-name { font-size: 15px; font-weight: 700; color: #9c523d; margin-bottom: 10px; }
        .card-detail { font-size: 11px; color: #666; margin-bottom: 5px; }
        .card-detail strong { color: #2c2c2c; }
        .card-avg { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0e8e0; text-align: center; }
        .card-avg-label { font-size: 10px; color: #999; }
        .card-avg-score { font-size: 18px; color: #e6cd87; font-weight: 700; }
        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .card-btn { flex: 1; padding: 8px; background: #f0e8e0; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; color: #9c523d; transition: all 0.2s; }
        .card-btn:hover { background: #e8d4c7; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 4px; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-header { background: linear-gradient(135deg, #9c523d 0%, #7d4230 100%); color: white; padding: 30px; border-bottom: 1px solid #e8d4c7; }
        .modal-header h2 { font-size: 24px; margin-bottom: 5px; }
        .modal-header p { font-size: 12px; opacity: 0.9; }
        .modal-body { padding: 30px; }
        .detail-section { margin-bottom: 25px; }
        .detail-label { font-size: 11px; color: #999; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
        .detail-value { font-size: 14px; color: #2c2c2c; }
        .rating-section { margin-bottom: 20px; }
        .rating-title { font-size: 13px; font-weight: 700; color: #2c2c2c; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .competency-num { background: #9c523d; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .rating-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .rating-btn { padding: 10px; background: #f0e8e0; border: 2px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-weight: 600; color: #9c523d; transition: all 0.2s; }
        .rating-btn:hover { border-color: #9c523d; }
        .rating-btn.active { background: #9c523d; color: white; border-color: #9c523d; }
        textarea { width: 100%; padding: 10px; border: 1px solid #d4c5b9; border-radius: 4px; font-family: 'Bitter', serif; font-size: 12px; min-height: 70px; }
        .modal-footer { display: flex; gap: 12px; padding: 20px 30px; border-top: 1px solid #f0e8e0; }
        .btn { padding: 11px 24px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 12px; letter-spacing: 1px; font-weight: 600; }
        .btn-primary { background: #9c523d; color: white; }
        .btn-primary:hover { background: #7d4230; }
        .btn-secondary { background: #f0e8e0; color: #9c523d; border: 1px solid #d4c5b9; }
        .btn-secondary:hover { background: #e8d4c7; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.3); border: none; color: white; font-size: 24px; cursor: pointer; width: 40px; height: 40px; border-radius: 4px; }
        .close-btn:hover { background: rgba(255,255,255,0.5); }

        /* Forms */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #999; margin-bottom: 6px; letter-spacing: 1px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #d4c5b9; border-radius: 4px; font-family: 'Bitter', serif; font-size: 12px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #9c523d; }

        /* Table */
        .candidates-table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); }
        .candidates-table th { background: #9c523d; color: white; padding: 12px; text-align: left; font-size: 12px; letter-spacing: 1px; }
        .candidates-table td { padding: 12px; border-bottom: 1px solid #f0e8e0; font-size: 12px; }
        .candidates-table tr:hover { background: #faf8f5; }
        .btn-small { padding: 6px 12px; background: #f0e8e0; border: 1px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-size: 11px; color: #9c523d; }
        .btn-small:hover { background: #e8d4c7; }
        .btn-delete { padding: 6px 12px; background: #ffebee; border: 1px solid #f48771; border-radius: 4px; cursor: pointer; font-size: 11px; color: #d32f2f; }
        .btn-delete:hover { background: #ffdbdb; }

        .loading { text-align: center; padding: 40px; color: #999; }
        .empty { text-align: center; padding: 60px 20px; color: #999; }
        .error { color: #d32f2f; background: #ffebee; padding: 15px; border-radius: 4px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-text">CLT</div>
            <div class="logo-year">1998</div>
        </div>
        
        <div class="header">
            <h1 id="pageTitle">CASA LAS TORTUGAS</h1>
            <p id="pageSubtitle">RECRUITMENT DASHBOARD</p>
        </div>
        
        <div id="backLinkContainer" class="back-link" style="display: none;">
            <a href="/" onclick="router(); return false;">← Volver a vacantes</a>
        </div>
        
        <div id="navTabsContainer" style="display: none;">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('evaluate')">EVALUAR</button>
                <button class="nav-tab" onclick="switchTab('manage')">GESTIONAR</button>
            </div>
        </div>
        
        <div id="mainContent">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <h2 id="modalName"></h2>
                <p id="modalPosition"></p>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeRatingModal()">✕</button>
            <div class="modal-header">
                <h2>Evaluar: <span id="ratingCandidateName"></span></h2>
                <p>Ingrese su nombre para guardar la evaluación</p>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Su nombre</label>
                        <input type="text" id="raterName" placeholder="p.ej. María, Juan">
                    </div>
                </div>
                <div id="ratingContent"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRatingModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveRating()">Guardar evaluación</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        let db, storage;
        const firebaseConfig = {
            apiKey: "AIzaSyDNzqc4jZOl5LStJkAQkwL3kwPgNf5vScU",
            authDomain: "casa-las-tortugas-candidates.firebaseapp.com",
            projectId: "casa-las-tortugas-candidates",
            storageBucket: "casa-las-tortugas-candidates.firebasestorage.app",
            messagingSenderId: "944487796645",
            appId: "1:944487796645:web:a741565ab36236c0d9a24c"
        };

        const competencies = ['Operaciones Boutique', 'Inglés Fluido', 'Gestión Limpieza', 'PMS/Tecnología', 'Liderazgo', 'Estándares Servicio', 'Resolución Problemas', 'Control Presupuesto'];
        
        const vacancies = [
            { slug: 'gerente-operativo', name: 'Gerente Operativo', icon: '👔' },
            { slug: 'recepcionista', name: 'Recepcionista', icon: '📞' },
            { slug: 'ama-de-llaves', name: 'Ama de Llaves', icon: '🏠' }
        ];

        function initFirebase() {
            if (typeof firebase === 'undefined') {
                setTimeout(initFirebase, 100);
                return;
            }
            if (firebase.apps.length === 0) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            storage = firebase.storage();
            router();
        }

        function router() {
            const path = window.location.pathname;
            const match = path.match(/\/dashboard\/([a-z-]+)/);
            
            document.getElementById('backLinkContainer').style.display = 'none';
            document.getElementById('navTabsContainer').style.display = 'none';
            document.getElementById('pageTitle').textContent = 'CASA LAS TORTUGAS';
            document.getElementById('pageSubtitle').textContent = 'RECRUITMENT DASHBOARD';

            if (match) {
                loadVacancyDashboard(match[1]);
            } else {
                loadMasterDashboard();
            }
        }

        async function loadMasterDashboard() {
            const mainContent = document.getElementById('mainContent');
            let html = '<div class="vacancies-grid">';

            for (const vacancy of vacancies) {
                try {
                    const snapshot = await db.collection('candidates')
                        .where('vacante', '==', vacancy.slug)
                        .get();
                    const count = snapshot.size;

                    html += `
                        <div class="vacancy-card" onclick="window.location.href='/dashboard/${vacancy.slug}'">
                            <div class="vacancy-icon">${vacancy.icon}</div>
                            <div class="vacancy-title">${vacancy.name}</div>
                            <div class="vacancy-count">${count}</div>
                            <div class="vacancy-label">candidatos en proceso</div>
                            <button class="vacancy-btn">Abrir dashboard</button>
                        </div>
                    `;
                } catch (error) {
                    console.error(`Error: ${vacancy.slug}`, error);
                }
            }

            html += '</div>';
            mainContent.innerHTML = html;
        }

        async function loadVacancyDashboard(slug) {
            const vacancy = vacancies.find(v => v.slug === slug);
            if (!vacancy) {
                document.getElementById('mainContent').innerHTML = '<div class="error">Vacante no encontrada</div>';
                return;
            }

            document.getElementById('pageTitle').textContent = vacancy.name.toUpperCase();
            document.getElementById('pageSubtitle').textContent = 'CASA LAS TORTUGAS — CANDIDATE EVALUATION';
            document.getElementById('backLinkContainer').style.display = 'block';
            document.getElementById('navTabsContainer').style.display = 'block';

            const snapshot = await db.collection('candidates')
                .where('vacante', '==', slug)
                .get();

            window.currentVacancy = slug;
            window.currentCandidates = [];

            snapshot.forEach(doc => {
                window.currentCandidates.push({ id: doc.id, ...doc.data() });
            });

            renderCandidateCards();
            renderCandidateTable();
        }

        function renderCandidateCards() {
            const mainContent = document.getElementById('mainContent');
            const evaluateTab = document.createElement('div');
            evaluateTab.id = 'evaluate-tab';
            evaluateTab.className = 'tab-content active';

            if (window.currentCandidates.length === 0) {
                evaluateTab.innerHTML = '<div class="empty">No hay candidatos para esta vacante</div>';
            } else {
                let html = '<div class="candidates-grid">';
                window.currentCandidates.forEach(c => {
                    const avgRating = calculateAverage(c.ratings);
                    html += `
                        <div class="candidate-card">
                            <div class="card-photo">
                                ${c.photoUrl ? `<img src="${c.photoUrl}" alt="${c.name}">` : c.name.charAt(0).toUpperCase()}
                                <div class="experience-badge">${c.experience || 0}y</div>
                            </div>
                            <div class="card-content">
                                <div class="card-name">${c.name}</div>
                                <div class="card-detail"><strong>Email:</strong> ${c.email || 'N/A'}</div>
                                <div class="card-detail"><strong>Teléfono:</strong> ${c.phone || 'N/A'}</div>
                                <div class="card-detail"><strong>PMS:</strong> ${c.pms || 'N/A'}</div>
                                <div class="card-avg">
                                    <div class="card-avg-label">Promedio</div>
                                    <div class="card-avg-score">${avgRating}</div>
                                </div>
                                <div class="card-actions">
                                    <button class="card-btn" onclick="showDetail('${c.id}')">Ver perfil</button>
                                    <button class="card-btn" onclick="openRating('${c.id}', '${c.name}')">Evaluar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                evaluateTab.innerHTML = html;
            }

            mainContent.innerHTML = '';
            mainContent.appendChild(evaluateTab);

            const manageTab = document.createElement('div');
            manageTab.id = 'manage-tab';
            manageTab.className = 'tab-content';
            manageTab.innerHTML = `
                <div style="background: white; padding: 25px; border-radius: 4px; margin-bottom: 25px;">
                    <h3 style="color: #9c523d; margin-bottom: 20px;">Agregar nuevo candidato</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="newName" placeholder="Nombre del candidato">
                        </div>
                        <div class="form-group">
                            <label>Experiencia (años)</label>
                            <input type="number" id="newExperience" placeholder="ej: 5">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="newEmail" placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="newPhone" placeholder="Teléfono">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>PMS</label>
                            <input type="text" id="newPms" placeholder="ej: Opera, Mews">
                        </div>
                        <div class="form-group">
                            <label>Disponibilidad</label>
                            <input type="text" id="newAvailability" placeholder="ej: Inmediato">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>CV URL</label>
                            <input type="text" id="newCvUrl" placeholder="https://...">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addCandidate()">Agregar candidato</button>
                </div>

                <table class="candidates-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Experiencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="candidatesTableBody">
                    </tbody>
                </table>
            `;
            mainContent.appendChild(manageTab);
        }

        function renderCandidateTable() {
            const tbody = document.getElementById('candidatesTableBody');
            tbody.innerHTML = '';

            window.currentCandidates.forEach(c => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${c.name}</td>
                    <td>${c.email || 'N/A'}</td>
                    <td>${c.experience || 'N/A'}</td>
                    <td>
                        <button class="btn-small" onclick="showDetail('${c.id}')">Ver</button>
                        <button class="btn-delete" onclick="deleteCandidate('${c.id}')">Eliminar</button>
                    </td>
                `;
            });
        }

        function calculateAverage(ratings) {
            if (!ratings || Object.keys(ratings).length === 0) return '—';
            let total = 0, count = 0;
            Object.values(ratings).forEach(rater => {
                Object.values(rater).forEach(score => {
                    if (typeof score === 'number') {
                        total += score;
                        count++;
                    }
                });
            });
            return count === 0 ? '—' : (total / count).toFixed(1);
        }

        async function showDetail(docId) {
            const candidate = window.currentCandidates.find(c => c.id === docId);
            if (!candidate) return;

            document.getElementById('modalName').textContent = candidate.name;
            document.getElementById('modalPosition').textContent = candidate.experience + ' años de experiencia';

            let ratings = '';
            if (candidate.ratings && Object.keys(candidate.ratings).length > 0) {
                ratings = '<div class="detail-section"><div class="detail-label">EVALUACIONES</div>';
                Object.entries(candidate.ratings).forEach(([rater, scores]) => {
                    ratings += `<div style="margin-bottom: 12px;"><strong>${rater}:</strong><br>`;
                    competencies.forEach((comp, idx) => {
                        const score = scores[comp];
                        if (score) {
                            ratings += `${comp}: <strong>${score}</strong> &nbsp;`;
                        }
                    });
                    ratings += '</div>';
                });
                ratings += '</div>';
            }

            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <div class="detail-label">PROMEDIO</div>
                    <div style="font-size: 28px; color: #e6cd87; font-weight: 700;">${calculateAverage(candidate.ratings)}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">EMAIL</div>
                    <div class="detail-value">${candidate.email || 'N/A'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">TELÉFONO</div>
                    <div class="detail-value">${candidate.phone || 'N/A'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">PMS</div>
                    <div class="detail-value">${candidate.pms || 'N/A'}</div>
                </div>
                ${ratings}
                ${candidate.cvUrl ? `<div class="detail-section"><a href="${candidate.cvUrl}" target="_blank" style="color: #9c523d; text-decoration: none; font-weight: 600;">📥 Descargar CV</a></div>` : ''}
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function openRating(docId, name) {
            const raterName = prompt('Ingrese su nombre para guardar la evaluación:');
            if (!raterName) return;

            let html = '';
            competencies.forEach((comp, idx) => {
                html += `
                    <div class="rating-section">
                        <div class="rating-title">
                            <div class="competency-num">${idx + 1}</div>
                            ${comp}
                        </div>
                        <div class="rating-buttons">
                            ${[1,2,3,4,5].map(n => `<button class="rating-btn" onclick="window.setRating('${comp}', ${n})">${n}</button>`).join('')}
                        </div>
                    </div>
                `;
            });

            document.getElementById('ratingContent').innerHTML = html;
            document.getElementById('ratingCandidateName').textContent = name;
            window.currentRatingDocId = docId;
            window.currentRatingRaterName = raterName;
            window.currentRatings = {};

            document.getElementById('ratingModal').classList.add('active');
        }

        window.setRating = function(competency, rating) {
            event.target.parentElement.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            window.currentRatings[competency] = rating;
        };

        async function saveRating() {
            if (Object.keys(window.currentRatings || {}).length === 0) {
                alert('Por favor calificar al menos una competencia');
                return;
            }

            try {
                const ref = db.collection('candidates').doc(window.currentRatingDocId);
                const doc = await ref.get();
                const ratings = doc.data().ratings || {};
                ratings[window.currentRatingRaterName] = window.currentRatings;
                await ref.update({ ratings });
                closeRatingModal();
                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addCandidate() {
            const name = document.getElementById('newName').value.trim();
            if (!name) { alert('Ingrese el nombre'); return; }

            try {
                await db.collection('candidates').add({
                    name,
                    email: document.getElementById('newEmail').value.trim(),
                    phone: document.getElementById('newPhone').value.trim(),
                    experience: parseInt(document.getElementById('newExperience').value) || 0,
                    pms: document.getElementById('newPms').value.trim(),
                    availability: document.getElementById('newAvailability').value.trim(),
                    cvUrl: document.getElementById('newCvUrl').value.trim(),
                    vacante: window.currentVacancy,
                    round: 'round1',
                    ratings: {}
                });

                document.getElementById('newName').value = '';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPhone').value = '';
                document.getElementById('newExperience').value = '';
                document.getElementById('newPms').value = '';
                document.getElementById('newAvailability').value = '';
                document.getElementById('newCvUrl').value = '';

                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteCandidate(docId) {
            if (!confirm('¿Eliminar este candidato?')) return;
            try {
                await db.collection('candidates').doc(docId).delete();
                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function closeRatingModal() {
            document.getElementById('ratingModal').classList.remove('active');
        }

        window.addEventListener('popstate', router);
        initFirebase();
    </script>
</body>
</html>
