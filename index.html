
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente de Operaciones - Candidate Evaluation</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #f5f2ed 0%, #faf8f5 100%);
            font-family: 'Bitter', serif; 
            color: #2c2c2c; 
            padding: 40px 20px;
        }
        .container { max-width: 1300px; margin: 0 auto; }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-img { max-height: 120px; width: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 12px rgba(156, 82, 61, 0.15)); animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
        .header { text-align: center; margin-bottom: 50px; border-bottom: 2px solid #e6cd87; padding-bottom: 30px; }
        .header h1 { font-size: 48px; color: #9c523d; margin-bottom: 12px; font-weight: 400; letter-spacing: 3px; }
        .header p { font-size: 14px; color: #81a1ab; letter-spacing: 2px; }
        .nav-tabs { display: flex; gap: 30px; border-bottom: 2px solid #e6cd87; margin-bottom: 40px; }
        .nav-tab { padding: 16px 0; border: none; background: none; font-family: 'Bitter', serif; font-size: 14px; letter-spacing: 2px; color: #999; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s ease; }
        .nav-tab:hover { color: #9c523d; }
        .nav-tab.active { color: #9c523d; border-bottom-color: #e6cd87; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; margin-bottom: 40px; padding: 30px; background: white; border-radius: 4px; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); }
        .controls input, .controls select { padding: 12px; border: 1px solid #d4c5b9; border-radius: 4px; font-family: 'Bitter', serif; font-size: 13px; }
        .controls label { display: block; font-size: 11px; color: #999; margin-bottom: 8px; letter-spacing: 1px; }
        .btn-export { padding: 12px 24px; background: #e6cd87; color: #2c2c2c; border: none; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 13px; letter-spacing: 1px; font-weight: 600; align-self: flex-end; transition: all 0.3s ease; }
        .btn-export:hover { background: #d4b86f; }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .candidate-card { background: white; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); transition: all 0.3s ease; border: 1px solid #f0e8e0; }
        .candidate-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.15); transform: translateY(-4px); }
        .card-photo { width: 100%; height: 280px; background: linear-gradient(135deg, #e6cd87 0%, #dd9973 100%); display: flex; align-items: center; justify-content: center; font-size: 60px; overflow: hidden; }
        .card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 24px; }
        .card-name { font-size: 18px; font-weight: 700; color: #9c523d; margin-bottom: 8px; }
        .card-position { font-size: 12px; color: #999; margin-bottom: 16px; }
        .card-score { display: flex; justify-content: space-between; padding-top: 16px; border-top: 2px solid #f0e8e0; margin-bottom: 12px; }
        .score-number { font-size: 28px; font-weight: 700; color: #e6cd87; }
        .score-label { font-size: 11px; color: #999; }
        .card-round { display: inline-block; padding: 6px 12px; background: #f0e8e0; border-radius: 4px; font-size: 11px; margin-bottom: 12px; color: #9c523d; font-weight: 600; }
        .card-round.final { background: #d4e8de; color: #2d6a4f; }
        .card-round.round2 { background: #fef3c7; color: #92400e; }
        .card-round.round1 { background: #dbeafe; color: #0c4a6e; }
        .candidate-form { background: white; padding: 30px; border-radius: 4px; margin-bottom: 30px; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #999; margin-bottom: 8px; letter-spacing: 1px; }
        .form-group input { padding: 12px; border: 1px solid #d4c5b9; border-radius: 4px; font-family: 'Bitter', serif; font-size: 13px; }
        .btn-add { padding: 14px 28px; background: #9c523d; color: white; border: none; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 13px; margin-bottom: 20px; letter-spacing: 1px; font-weight: 600; transition: all 0.3s ease; }
        .btn-add:hover { background: #7d4230; }
        .candidates-table { background: white; border-radius: 4px; width: 100%; border-collapse: collapse; font-size: 13px; box-shadow: 0 2px 12px rgba(156, 82, 61, 0.08); }
        .candidates-table th { background: linear-gradient(135deg, #9c523d 0%, #7d4230 100%); padding: 16px; text-align: left; font-weight: 600; color: white; letter-spacing: 1px; }
        .candidates-table td { padding: 14px 16px; border-bottom: 1px solid #f0e8e0; }
        .candidates-table tr:hover { background: #faf8f5; }
        .btn-small { padding: 6px 12px; background: white; border: 1px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 12px; margin-right: 6px; transition: all 0.2s ease; }
        .btn-small:hover { background: #f0e8e0; border-color: #9c523d; color: #9c523d; }
        .btn-delete { padding: 6px 12px; background: #f5e8e3; border: 1px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-size: 11px; color: #9c523d; transition: all 0.2s ease; }
        .btn-delete:hover { background: #e8d4c7; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 4px; max-width: 600px; width: 100%; padding: 40px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-title { font-size: 28px; color: #9c523d; margin-bottom: 30px; border-bottom: 2px solid #e6cd87; padding-bottom: 16px; }
        .detail-section { margin-bottom: 24px; }
        .detail-label { font-size: 11px; color: #999; margin-bottom: 6px; letter-spacing: 1px; }
        .detail-value { font-size: 14px; color: #2c2c2c; }
        .modal-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; padding-top: 30px; border-top: 1px solid #f0e8e0; }
        .btn-secondary { padding: 12px; background: white; border: 2px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 13px; transition: all 0.3s ease; }
        .btn-secondary:hover { border-color: #9c523d; color: #9c523d; }
        .btn-primary { padding: 12px; background: #9c523d; color: white; border: 1px solid #9c523d; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 13px; transition: all 0.3s ease; }
        .btn-primary:hover { background: #7d4230; }
        .rating-section { margin-bottom: 30px; }
        .rating-label { font-size: 13px; font-weight: 600; color: #2c2c2c; margin-bottom: 12px; display: block; }
        .rating-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .rating-btn { padding: 12px; background: #f0e8e0; border: 2px solid #d4c5b9; border-radius: 4px; cursor: pointer; font-family: 'Bitter', serif; font-size: 14px; font-weight: 600; transition: all 0.2s ease; }
        .rating-btn:hover { border-color: #e6cd87; }
        .rating-btn.active { background: #9c523d; color: white; border-color: #9c523d; }
        textarea { width: 100%; padding: 12px; border: 1px solid #d4c5b9; border-radius: 4px; font-family: 'Bitter', serif; font-size: 13px; resize: vertical; min-height: 80px; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: #f0e8e0; border: 1px solid #d4c5b9; border-radius: 4px; padding: 6px 12px; cursor: pointer; font-size: 18px; transition: all 0.2s ease; }
        .close-btn:hover { background: #e8d4c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="https://firebasestorage.googleapis.com/v0/b/casa-las-tortugas-candidates.appspot.com/o/photos%2FCLT_Acronimo5.png?alt=media" alt="CLT Logo" class="logo-img">
        </div>
        
        <div class="header">
            <h1>GERENTE DE OPERACIONES</h1>
            <p>CASA LAS TORTUGAS — CANDIDATE EVALUATION</p>
        </div>
        
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('evaluate')">EVALUATE</button>
            <button class="nav-tab" onclick="switchTab('candidates')">MANAGE CANDIDATES</button>
        </div>
        
        <div id="evaluate-tab" class="tab-content active">
            <div class="controls">
                <div>
                    <label>Your Name</label>
                    <input type="text" id="raterName" placeholder="e.g., María, Juan">
                </div>
                <div>
                    <label>Filter by Round</label>
                    <select id="roundFilter">
                        <option value="all">All Candidates</option>
                    </select>
                </div>
                <button class="btn-export" onclick="exportCSV()">EXPORT CSV</button>
            </div>
            <div class="cards-grid" id="cardsGrid"></div>
        </div>
        
        <div id="candidates-tab" class="tab-content">
            <div class="candidate-form">
                <h2 style="font-size: 20px; color: #9c523d; margin-bottom: 20px;">ADD NEW CANDIDATE</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="form-name" placeholder="Enter candidate name">
                    </div>
                    <div class="form-group">
                        <label>Position</label>
                        <input type="text" id="form-position" placeholder="e.g., Hotel Operations Manager">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="form-email" placeholder="candidate@example.com">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="tel" id="form-phone" placeholder="+52 984 123 4567">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Experience (years)</label>
                        <input type="number" id="form-experience" placeholder="e.g., 5" min="0">
                    </div>
                    <div class="form-group">
                        <label>PMS Systems</label>
                        <input type="text" id="form-pms" placeholder="e.g., Opera, Hotelminder">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Availability</label>
                        <input type="text" id="form-availability" placeholder="e.g., 2 weeks">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Profile Photo</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="file" id="form-photo" accept=".jpg,.jpeg,.png" style="flex: 1;">
                            <button type="button" onclick="document.getElementById('form-photo').value = ''" style="padding: 12px 16px; background: #f5e8e3; border: 1px solid #d4c5b9; border-radius: 2px; cursor: pointer; color: #9c523d; font-weight: 600;">Clear</button>
                        </div>
                        <small id="form-photo-name" style="color: #999; margin-top: 6px; display: none;">Selected: <span id="form-photo-text"></span></small>
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>CV (PDF)</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="file" id="form-cv" accept=".pdf" style="flex: 1;">
                            <button type="button" onclick="document.getElementById('form-cv').value = ''" style="padding: 12px 16px; background: #f5e8e3; border: 1px solid #d4c5b9; border-radius: 2px; cursor: pointer; color: #9c523d; font-weight: 600;">Clear</button>
                        </div>
                        <small id="form-cv-name" style="color: #999; margin-top: 6px; display: none;">Selected: <span id="form-cv-text"></span></small>
                    </div>
                </div>
                <button class="btn-add" onclick="window.addCandidate()">ADD CANDIDATE</button>
            </div>
            
            <table class="candidates-table" id="candidatesTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Email</th>
                        <th>Experience</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="candidatesList"></tbody>
            </table>
        </div>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 class="modal-title" id="modalName">Candidate Name</h2>
            <div id="modalBody"></div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeRatingModal()">×</button>
            <h2 class="modal-title">Rate <span id="ratingCandidateName"></span></h2>
            <div id="ratingContent"></div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeRatingModal()">Cancel</button>
                <button class="btn-primary" onclick="window.saveRating()">Save Rating</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyDNzqc4jZOl5LStJkAQkwL3kwPgNf5vScU",
            authDomain: "casa-las-tortugas-candidates.firebaseapp.com",
            projectId: "casa-las-tortugas-candidates",
            storageBucket: "casa-las-tortugas-candidates.firebasestorage.app",
            messagingSenderId: "944487796645",
            appId: "1:944487796645:web:a741565ab36236c0d9a24c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.db = db;
        window.storage = storage;

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.classList.add('active');
        };

        window.addCandidate = async function() {
            const name = document.getElementById('form-name').value.trim();
            if (!name) {
                alert('Please enter candidate name');
                return;
            }

            const position = document.getElementById('form-position').value || '';
            const email = document.getElementById('form-email').value || '';
            const phone = document.getElementById('form-phone').value || '';
            const experience = document.getElementById('form-experience').value || '';
            const pms = document.getElementById('form-pms').value || '';
            const availability = document.getElementById('form-availability').value || '';
            const photoFile = document.getElementById('form-photo').files[0];
            const cvFile = document.getElementById('form-cv').files[0];

            let photoUrl = null;
            let cvUrl = null;

            if (photoFile) {
                const photoRef = ref(storage, `photos/${name}_${Date.now()}.jpg`);
                try {
                    await uploadBytes(photoRef, photoFile);
                    photoUrl = await getDownloadURL(photoRef);
                } catch (error) {
                    console.error('Photo upload error:', error);
                }
            }

            if (cvFile) {
                const cvRef = ref(storage, `cvs/${name}_${Date.now()}.pdf`);
                try {
                    await uploadBytes(cvRef, cvFile);
                    cvUrl = await getDownloadURL(cvRef);
                } catch (error) {
                    console.error('CV upload error:', error);
                }
            }

            try {
                await addDoc(collection(db, 'candidates'), {
                    name, position, email, phone, experience, pms, availability,
                    photoUrl, cvUrl, createdAt: new Date(), round: 'round1', ratings: {}
                });
                document.getElementById('form-name').value = '';
                document.getElementById('form-position').value = '';
                document.getElementById('form-email').value = '';
                document.getElementById('form-phone').value = '';
                document.getElementById('form-experience').value = '';
                document.getElementById('form-pms').value = '';
                document.getElementById('form-availability').value = '';
                document.getElementById('form-photo').value = '';
                document.getElementById('form-cv').value = '';
                window.loadCandidates();
            } catch (error) {
                console.error('Error adding candidate:', error);
                alert('Error adding candidate');
            }
        };

        window.loadCandidates = async function() {
            try {
                const querySnapshot = await getDocs(query(collection(db, 'candidates'), orderBy('name')));
                const cardsGrid = document.getElementById('cardsGrid');
                const candidatesList = document.getElementById('candidatesList');
                cardsGrid.innerHTML = '';
                candidatesList.innerHTML = '';

                querySnapshot.forEach(docSnap => {
                    const c = docSnap.data();
                    const docId = docSnap.id;
                    const avgRating = c.ratings ? Object.values(c.ratings).reduce((a,b) => a+b, 0) / Object.keys(c.ratings).length : 0;

                    const card = document.createElement('div');
                    card.className = 'candidate-card';
                    card.innerHTML = `
                        <div class="card-photo">${c.photoUrl ? `<img src="${c.photoUrl}">` : '👤'}</div>
                        <div class="card-content">
                            <div class="card-name">${c.name}</div>
                            <div class="card-position">${c.position || 'N/A'}</div>
                            <div class="card-score"><div><div class="score-number">${avgRating.toFixed(1)}</div></div><div class="score-label">Avg Rating</div></div>
                            <span class="card-round ${c.round}">${c.round}</span>
                            <div style="margin-top: 16px; display: flex; gap: 8px;">
                                <button class="btn-small" onclick="window.openRating('${docId}', '${c.name}')">+ RATE</button>
                                <button class="btn-small" onclick="window.openDetail('${docId}')">INFO</button>
                                <button class="btn-delete" onclick="window.deleteCandidate('${docId}')">Delete</button>
                            </div>
                        </div>
                    `;
                    cardsGrid.appendChild(card);

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${c.name}</td>
                        <td>${c.position || '—'}</td>
                        <td>${c.email || '—'}</td>
                        <td>${c.experience || '—'}</td>
                        <td>
                            <button class="btn-small" onclick="window.openDetail('${docId}')">View</button>
                            <button class="btn-small" onclick="window.deleteCandidate('${docId}')">Delete</button>
                        </td>
                    `;
                    candidatesList.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading candidates:', error);
            }
        };

        window.openDetail = function(docId) {
            const modalBody = document.getElementById('modalBody');
            const candidate = db.collection('candidates').doc(docId);
            candidate.get().then(doc => {
                if (doc.exists) {
                    const c = doc.data();
                    modalBody.innerHTML = `
                        ${c.photoUrl ? `<div style="text-align: center; margin-bottom: 30px;"><img src="${c.photoUrl}" style="width: 200px; height: 200px; border-radius: 8px; object-fit: cover;"></div>` : ''}
                        <div class="detail-section">
                            <div class="detail-label">POSITION</div>
                            <div class="detail-value">${c.position || 'N/A'}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">EMAIL</div>
                            <div class="detail-value">${c.email || 'N/A'}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">PHONE</div>
                            <div class="detail-value">${c.phone || 'N/A'}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">EXPERIENCE</div>
                            <div class="detail-value">${c.experience || 'N/A'} years</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">PMS SYSTEMS</div>
                            <div class="detail-value">${c.pms || 'N/A'}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-label">AVAILABILITY</div>
                            <div class="detail-value">${c.availability || 'N/A'}</div>
                        </div>
                        ${c.cvUrl ? `<div class="detail-section"><a href="${c.cvUrl}" target="_blank" style="color: #9c523d; text-decoration: none; font-weight: 600;">📥 Download CV</a></div>` : ''}
                    `;
                    document.getElementById('detailModal').classList.add('active');
                    document.getElementById('modalName').textContent = c.name;
                }
            }).catch(error => console.error('Error:', error));
        };

        window.openRating = function(docId, name) {
            const raterName = document.getElementById('raterName').value.trim();
            if (!raterName) {
                alert('Please enter your name in the "Your Name" field at the top');
                return;
            }

            let ratingHTML = '';
            const competencies = ['Boutique Operations', 'English Fluency', 'Housekeeping Mgmt', 'PMS/Technology', 'Leadership', 'Service Standards', 'Problem-solving', 'Budget Control'];
            
            competencies.forEach((comp, idx) => {
                ratingHTML += `
                    <div class="rating-section">
                        <label class="rating-label">${idx+1}. ${comp}</label>
                        <div class="rating-buttons">
                            ${[1,2,3,4,5].map(num => `<button class="rating-btn" onclick="window.setRating('${comp}', ${num})">${num}</button>`).join('')}
                        </div>
                        <textarea id="comment-${comp}" placeholder="Comments (optional)"></textarea>
                    </div>
                `;
            });

            document.getElementById('ratingContent').innerHTML = ratingHTML;
            document.getElementById('ratingCandidateName').textContent = name;
            window.currentRatingDocId = docId;
            window.currentRatingRaterName = raterName;
            document.getElementById('ratingModal').classList.add('active');
        };

        window.setRating = function(competency, rating) {
            event.target.parentElement.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            window.currentRatings = window.currentRatings || {};
            window.currentRatings[competency] = rating;
        };

        window.saveRating = async function() {
            if (!window.currentRatings || Object.keys(window.currentRatings).length === 0) {
                alert('Please rate at least one competency');
                return;
            }

            try {
                const candidateRef = doc(db, 'candidates', window.currentRatingDocId);
                const candidateDoc = await getDoc(candidateRef);
                const ratings = candidateDoc.data().ratings || {};
                ratings[window.currentRatingRaterName] = window.currentRatings;
                
                await updateDoc(candidateRef, { ratings });
                window.currentRatings = null;
                closeRatingModal();
                window.loadCandidates();
            } catch (error) {
                console.error('Error saving rating:', error);
                alert('Error saving rating');
            }
        };

        window.deleteCandidate = async function(docId) {
            if (confirm('Delete this candidate?')) {
                try {
                    await deleteDoc(doc(db, 'candidates', docId));
                    window.loadCandidates();
                } catch (error) {
                    console.error('Error deleting candidate:', error);
                }
            }
        };

        window.closeModal = function() {
            document.getElementById('detailModal').classList.remove('active');
        };

        window.closeRatingModal = function() {
            document.getElementById('ratingModal').classList.remove('active');
        };

        window.exportCSV = function() {
            alert('Export feature coming soon');
        };

        window.loadCandidates();
    </script>
</body>
</html>
