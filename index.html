
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Las Tortugas - Recruitment Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #faf8f5;
            font-family: 'Bitter', serif; 
            color: #3a3a3a; 
            padding: 50px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .logo-section { text-align: center; margin-bottom: 60px; }
        #logoSection img { height: 75px; }
        
        .header { text-align: center; margin-bottom: 60px; }
        .header h1 { font-size: 42px; color: #3a3a3a; margin-bottom: 10px; font-weight: 400; letter-spacing: 4px; }
        .header p { font-size: 13px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
        
        .back-link { margin-bottom: 25px; }
        .back-link a { color: #9c523d; text-decoration: none; font-size: 12px; letter-spacing: 1px; }
        .back-link a:hover { text-decoration: underline; }

        /* Vacancies Grid */
        .vacancies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        .vacancy-card { background: white; padding: 50px 35px; text-align: center; box-shadow: 0 1px 8px rgba(0,0,0,0.05); transition: all 0.4s ease; border: 1px solid #efefef; }
        .vacancy-card:hover { box-shadow: 0 8px 24px rgba(156, 82, 61, 0.1); transform: translateY(-3px); }
        .vacancy-title { font-size: 22px; color: #3a3a3a; font-weight: 600; margin-bottom: 20px; letter-spacing: 1px; }
        .vacancy-count { font-size: 50px; color: #9c523d; font-weight: 600; margin: 25px 0; }
        .vacancy-label { font-size: 12px; color: #888; margin-bottom: 25px; letter-spacing: 1px; }
        .vacancy-btn { padding: 13px 28px; background: #9c523d; color: white; border: none; cursor: pointer; font-family: 'Bitter', serif; font-size: 12px; letter-spacing: 1px; font-weight: 600; transition: all 0.3s; }
        .vacancy-btn:hover { background: #7d3d2d; }

        /* Tabs */
        .nav-tabs { display: flex; gap: 40px; border-bottom: 1px solid #ddd; margin-bottom: 40px; }
        .nav-tab { padding: 15px 0; border: none; background: none; font-family: 'Bitter', serif; font-size: 12px; letter-spacing: 1px; color: #888; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; }
        .nav-tab:hover { color: #3a3a3a; }
        .nav-tab.active { color: #9c523d; border-bottom-color: #9c523d; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Candidates Grid */
        .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .candidate-card { background: white; overflow: hidden; box-shadow: 0 1px 8px rgba(0,0,0,0.05); transition: all 0.4s ease; border: 1px solid #efefef; position: relative; }
        .candidate-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card-photo { width: 100%; height: 200px; background: linear-gradient(135deg, #e6cd87 0%, #d4a574 100%); display: flex; align-items: center; justify-content: center; font-size: 56px; position: relative; }
        .card-photo img { width: 100%; height: 100%; object-fit: cover; }
        .experience-badge { position: absolute; top: 12px; right: 12px; background: rgba(156, 82, 61, 0.9); color: white; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
        .card-content { padding: 24px; }
        .card-name { font-size: 16px; font-weight: 600; color: #3a3a3a; margin-bottom: 12px; letter-spacing: 0.5px; }
        .card-detail { font-size: 11px; color: #888; margin-bottom: 6px; line-height: 1.5; }
        .card-avg { margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0f0f0; text-align: center; }
        .card-avg-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .card-avg-score { font-size: 20px; color: #9c523d; font-weight: 700; margin-top: 4px; }
        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .card-btn { flex: 1; padding: 9px; background: #f5f5f5; border: 1px solid #eee; cursor: pointer; font-size: 11px; font-weight: 600; color: #9c523d; transition: all 0.2s; font-family: 'Bitter', serif; letter-spacing: 0.5px; }
        .card-btn:hover { background: #efefef; border-color: #9c523d; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; }
        .modal-header { background: #3a3a3a; color: white; padding: 35px; border-bottom: 1px solid #555; }
        .modal-header h2 { font-size: 24px; margin-bottom: 6px; letter-spacing: 1px; font-weight: 600; }
        .modal-header p { font-size: 12px; opacity: 0.85; letter-spacing: 0.5px; }
        .modal-body { padding: 35px; }
        .detail-section { margin-bottom: 28px; }
        .detail-label { font-size: 11px; color: #888; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
        .detail-value { font-size: 14px; color: #3a3a3a; }
        .rating-section { margin-bottom: 24px; }
        .rating-title { font-size: 12px; font-weight: 600; color: #3a3a3a; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; letter-spacing: 0.5px; }
        .competency-num { background: #9c523d; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
        .rating-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .rating-btn { padding: 10px; background: #f5f5f5; border: 1px solid #ddd; cursor: pointer; font-weight: 600; color: #888; transition: all 0.2s; font-family: 'Bitter', serif; }
        .rating-btn:hover { border-color: #9c523d; color: #9c523d; }
        .rating-btn.active { background: #9c523d; color: white; border-color: #9c523d; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ddd; font-family: 'Bitter', serif; font-size: 12px; min-height: 70px; }
        .modal-footer { display: flex; gap: 12px; padding: 25px 35px; border-top: 1px solid #eee; }
        .btn { padding: 12px 28px; border: none; cursor: pointer; font-family: 'Bitter', serif; font-size: 12px; letter-spacing: 1px; font-weight: 600; }
        .btn-primary { background: #9c523d; color: white; }
        .btn-primary:hover { background: #7d3d2d; }
        .btn-secondary { background: white; color: #9c523d; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #f9f9f9; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 24px; cursor: pointer; width: 40px; height: 40px; }
        .close-btn:hover { background: rgba(255,255,255,0.4); }

        /* Forms */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-row.full { grid-template-columns: 1fr; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; color: #888; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
        .form-group input, .form-group select { padding: 11px; border: 1px solid #ddd; font-family: 'Bitter', serif; font-size: 12px; background: #fafafa; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #9c523d; background: white; }

        /* Table */
        .candidates-table { width: 100%; border-collapse: collapse; background: white; }
        .candidates-table th { background: #3a3a3a; color: white; padding: 14px; text-align: left; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
        .candidates-table td { padding: 14px; border-bottom: 1px solid #f0f0f0; font-size: 12px; }
        .candidates-table tr:hover { background: #fafafa; }
        .btn-small { padding: 7px 14px; background: #f5f5f5; border: 1px solid #ddd; cursor: pointer; font-size: 11px; color: #9c523d; font-family: 'Bitter', serif; letter-spacing: 0.5px; }
        .btn-small:hover { background: #efefef; }
        .btn-delete { padding: 7px 14px; background: #fff5f5; border: 1px solid #f0c0c0; cursor: pointer; font-size: 11px; color: #c00; font-family: 'Bitter', serif; }
        .btn-delete:hover { background: #ffe8e8; }

        .loading { text-align: center; padding: 50px; color: #888; font-size: 14px; }
        .empty { text-align: center; padding: 60px 20px; color: #888; }
        .error { color: #c00; background: #fff5f5; padding: 16px; margin: 20px 0; border: 1px solid #f0c0c0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section" id="logoSection">
            <div style="font-size: 48px; font-weight: 700; color: #9c523d; letter-spacing: 6px;">CLT</div>
        </div>
        
        <div class="header">
            <h1 id="pageTitle">CASA LAS TORTUGAS</h1>
            <p id="pageSubtitle">RECRUITMENT DASHBOARD</p>
        </div>
        
        <div id="backLinkContainer" class="back-link" style="display: none;">
            <a href="/" onclick="router(); return false;">← Volver a vacantes</a>
        </div>
        
        <div id="navTabsContainer" style="display: none;">
            <div class="nav-tabs">
                <button class="nav-tab active" onclick="switchTab('evaluate')">EVALUAR</button>
                <button class="nav-tab" onclick="switchTab('manage')">GESTIONAR</button>
            </div>
        </div>
        
        <div id="mainContent">
            <div class="loading">Cargando...</div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">✕</button>
            <div class="modal-header">
                <h2 id="modalName"></h2>
                <p id="modalPosition"></p>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- Rating Modal -->
    <div id="ratingModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeRatingModal()">✕</button>
            <div class="modal-header">
                <h2>Evaluar: <span id="ratingCandidateName"></span></h2>
                <p>Ingrese su nombre para guardar la evaluación</p>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Su nombre</label>
                        <input type="text" id="raterName" placeholder="p.ej. María, Juan">
                    </div>
                </div>
                <div id="ratingContent"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRatingModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveRating()">Guardar evaluación</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeEditModal()">✕</button>
            <div class="modal-header">
                <h2>Editar candidato</h2>
                <p id="editCandidateName"></p>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="editName">
                    </div>
                    <div class="form-group">
                        <label>Experiencia (años)</label>
                        <input type="number" id="editExperience">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editEmail">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" id="editPhone">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>PMS</label>
                        <input type="text" id="editPms">
                    </div>
                    <div class="form-group">
                        <label>Disponibilidad</label>
                        <input type="text" id="editAvailability">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>Foto de perfil</label>
                        <input type="file" id="editPhoto" accept="image/*">
                    </div>
                </div>
                <div class="form-row full">
                    <div class="form-group">
                        <label>CV (PDF, DOC, DOCX)</label>
                        <input type="file" id="editCV" accept=".pdf,.doc,.docx">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="saveEdit()">Guardar cambios</button>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <script>
        let db, storage;
        const firebaseConfig = {
            apiKey: "AIzaSyDNzqc4jZOl5LStJkAQkwL3kwPgNf5vScU",
            authDomain: "casa-las-tortugas-candidates.firebaseapp.com",
            projectId: "casa-las-tortugas-candidates",
            storageBucket: "casa-las-tortugas-candidates.firebasestorage.app",
            messagingSenderId: "944487796645",
            appId: "1:944487796645:web:a741565ab36236c0d9a24c"
        };

        const competencies = ['Operaciones Boutique', 'Inglés Fluido', 'Gestión Limpieza', 'PMS/Tecnología', 'Liderazgo', 'Estándares Servicio', 'Resolución Problemas', 'Control Presupuesto'];
        
        const vacancies = [
            { slug: 'gerente-operativo', name: 'Gerente Operativo' },
            { slug: 'recepcionista', name: 'Recepcionista' },
            { slug: 'ama-de-llaves', name: 'Ama de Llaves' }
        ];

        function loadLogo() {
            try {
                const logoRef = storage.ref().child('cvs/CLT_Acronimo5.png');
                logoRef.getDownloadURL().then(url => {
                    document.getElementById('logoSection').innerHTML = `<img src="${url}" alt="CLT Logo">`;
                }).catch(error => {
                    console.log('Logo not found');
                });
            } catch (error) {
                console.log('Could not load logo');
            }
        }

        function initFirebase() {
            if (typeof firebase === 'undefined') {
                setTimeout(initFirebase, 100);
                return;
            }
            if (firebase.apps.length === 0) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            storage = firebase.storage();
            loadLogo();
            router();
        }

        function router() {
            const path = window.location.pathname;
            const match = path.match(/\/dashboard\/([a-z-]+)/);
            
            document.getElementById('backLinkContainer').style.display = 'none';
            document.getElementById('navTabsContainer').style.display = 'none';
            document.getElementById('pageTitle').textContent = 'CASA LAS TORTUGAS';
            document.getElementById('pageSubtitle').textContent = 'RECRUITMENT DASHBOARD';

            if (match) {
                loadVacancyDashboard(match[1]);
            } else {
                loadMasterDashboard();
            }
        }

        async function loadMasterDashboard() {
            const mainContent = document.getElementById('mainContent');
            let html = '<div class="vacancies-grid">';

            for (const vacancy of vacancies) {
                try {
                    const snapshot = await db.collection('candidates')
                        .where('vacante', '==', vacancy.slug)
                        .get();
                    const count = snapshot.size;

                    html += `
                        <div class="vacancy-card" onclick="window.location.href='/dashboard/${vacancy.slug}'">
                            <div class="vacancy-title">${vacancy.name}</div>
                            <div class="vacancy-count">${count}</div>
                            <div class="vacancy-label">candidatos en proceso</div>
                            <button class="vacancy-btn">Abrir dashboard</button>
                        </div>
                    `;
                } catch (error) {
                    console.error(`Error: ${vacancy.slug}`, error);
                }
            }

            html += '</div>';
            mainContent.innerHTML = html;
        }

        async function loadVacancyDashboard(slug) {
            const vacancy = vacancies.find(v => v.slug === slug);
            if (!vacancy) {
                document.getElementById('mainContent').innerHTML = '<div class="error">Vacante no encontrada</div>';
                return;
            }

            document.getElementById('pageTitle').textContent = vacancy.name.toUpperCase();
            document.getElementById('pageSubtitle').textContent = 'CASA LAS TORTUGAS';
            document.getElementById('backLinkContainer').style.display = 'block';
            document.getElementById('navTabsContainer').style.display = 'block';

            const snapshot = await db.collection('candidates')
                .where('vacante', '==', slug)
                .get();

            window.currentVacancy = slug;
            window.currentCandidates = [];

            snapshot.forEach(doc => {
                window.currentCandidates.push({ id: doc.id, ...doc.data() });
            });

            renderCandidateCards();
            renderCandidateTable();
        }

        function renderCandidateCards() {
            const mainContent = document.getElementById('mainContent');
            const evaluateTab = document.createElement('div');
            evaluateTab.id = 'evaluate-tab';
            evaluateTab.className = 'tab-content active';

            if (window.currentCandidates.length === 0) {
                evaluateTab.innerHTML = '<div class="empty">No hay candidatos para esta vacante</div>';
            } else {
                let html = '<div class="candidates-grid">';
                window.currentCandidates.forEach(c => {
                    const avgRating = calculateAverage(c.ratings);
                    html += `
                        <div class="candidate-card">
                            <div class="card-photo">
                                ${c.photoUrl ? `<img src="${c.photoUrl}" alt="${c.name}">` : c.name.charAt(0).toUpperCase()}
                                <div class="experience-badge">${typeof c.experience === 'number' ? c.experience : 0}y</div>
                            </div>
                            <div class="card-content">
                                <div class="card-name">${c.name}</div>
                                <div class="card-detail"><strong>Email:</strong> ${c.email || 'N/A'}</div>
                                <div class="card-detail"><strong>Teléfono:</strong> ${c.phone || 'N/A'}</div>
                                <div class="card-detail"><strong>PMS:</strong> ${c.pms || 'N/A'}</div>
                                <div class="card-avg">
                                    <div class="card-avg-label">Promedio</div>
                                    <div class="card-avg-score">${avgRating}</div>
                                </div>
                                <div class="card-actions">
                                    <button class="card-btn" onclick="showDetail('${c.id}')">Ver perfil</button>
                                    <button class="card-btn" onclick="openRating('${c.id}', '${c.name}')">Evaluar</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                evaluateTab.innerHTML = html;
            }

            mainContent.innerHTML = '';
            mainContent.appendChild(evaluateTab);

            const manageTab = document.createElement('div');
            manageTab.id = 'manage-tab';
            manageTab.className = 'tab-content';
            manageTab.innerHTML = `
                <div style="background: white; padding: 35px; margin-bottom: 35px;">
                    <h3 style="color: #3a3a3a; margin-bottom: 25px; font-size: 18px; letter-spacing: 1px;">Agregar nuevo candidato</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre</label>
                            <input type="text" id="newName" placeholder="Nombre del candidato">
                        </div>
                        <div class="form-group">
                            <label>Experiencia (años)</label>
                            <input type="number" id="newExperience" placeholder="ej: 5">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="newEmail" placeholder="email@example.com">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="newPhone" placeholder="Teléfono">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>PMS</label>
                            <input type="text" id="newPms" placeholder="ej: Opera, Mews">
                        </div>
                        <div class="form-group">
                            <label>Disponibilidad</label>
                            <input type="text" id="newAvailability" placeholder="ej: Inmediato">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>Foto de perfil</label>
                            <input type="file" id="newPhoto" accept="image/*">
                        </div>
                    </div>
                    <div class="form-row full">
                        <div class="form-group">
                            <label>CV (PDF, DOC, DOCX)</label>
                            <input type="file" id="newCV" accept=".pdf,.doc,.docx">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="addCandidate()">Agregar candidato</button>
                </div>

                <table class="candidates-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Experiencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="candidatesTableBody">
                    </tbody>
                </table>
            `;
            mainContent.appendChild(manageTab);
        }

        function renderCandidateTable() {
            const tbody = document.getElementById('candidatesTableBody');
            tbody.innerHTML = '';

            window.currentCandidates.forEach(c => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${c.name}</td>
                    <td>${c.email || 'N/A'}</td>
                    <td>${c.experience || 'N/A'}</td>
                    <td>
                        <button class="btn-small" onclick="showDetail('${c.id}')">Ver</button>
                        <button class="btn-delete" onclick="deleteCandidate('${c.id}')">Eliminar</button>
                    </td>
                `;
            });
        }

        function calculateAverage(ratings) {
            if (!ratings || Object.keys(ratings).length === 0) return '—';
            let total = 0, count = 0;
            Object.values(ratings).forEach(rater => {
                Object.values(rater).forEach(score => {
                    if (typeof score === 'number') {
                        total += score;
                        count++;
                    }
                });
            });
            return count === 0 ? '—' : (total / count).toFixed(1);
        }

        async function showDetail(docId) {
            const candidate = window.currentCandidates.find(c => c.id === docId);
            if (!candidate) return;

            document.getElementById('modalName').textContent = candidate.name;
            document.getElementById('modalPosition').textContent = candidate.experience + ' años de experiencia';

            let ratings = '';
            if (candidate.ratings && Object.keys(candidate.ratings).length > 0) {
                ratings = '<div class="detail-section"><div class="detail-label">EVALUACIONES</div>';
                Object.entries(candidate.ratings).forEach(([rater, scores]) => {
                    ratings += `<div style="margin-bottom: 12px;"><strong>${rater}:</strong><br>`;
                    competencies.forEach((comp, idx) => {
                        const score = scores[comp];
                        if (score) {
                            ratings += `${comp}: <strong>${score}</strong> &nbsp;`;
                        }
                    });
                    ratings += '</div>';
                });
                ratings += '</div>';
            }

            document.getElementById('modalBody').innerHTML = `
                <div class="detail-section">
                    <div class="detail-label">PROMEDIO</div>
                    <div style="font-size: 28px; color: #9c523d; font-weight: 700;">${calculateAverage(candidate.ratings)}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">EMAIL</div>
                    <div class="detail-value">${candidate.email || 'N/A'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">TELÉFONO</div>
                    <div class="detail-value">${candidate.phone || 'N/A'}</div>
                </div>
                <div class="detail-section">
                    <div class="detail-label">PMS</div>
                    <div class="detail-value">${candidate.pms || 'N/A'}</div>
                </div>
                ${ratings}
                ${candidate.cvUrl ? `<div class="detail-section"><a href="${candidate.cvUrl}" target="_blank" style="color: #9c523d; text-decoration: none; font-weight: 600;">📥 Descargar CV</a></div>` : ''}
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #f0f0f0;">
                    <button class="btn btn-primary" onclick="openEditModal('${docId}')">Editar candidato</button>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        function openRating(docId, name) {
            const raterName = prompt('Ingrese su nombre para guardar la evaluación:');
            if (!raterName) return;

            let html = '';
            competencies.forEach((comp, idx) => {
                html += `
                    <div class="rating-section">
                        <div class="rating-title">
                            <div class="competency-num">${idx + 1}</div>
                            ${comp}
                        </div>
                        <div class="rating-buttons">
                            ${[1,2,3,4,5].map(n => `<button class="rating-btn" onclick="window.setRating('${comp}', ${n})">${n}</button>`).join('')}
                        </div>
                    </div>
                `;
            });

            document.getElementById('ratingContent').innerHTML = html;
            document.getElementById('ratingCandidateName').textContent = name;
            window.currentRatingDocId = docId;
            window.currentRatingRaterName = raterName;
            window.currentRatings = {};

            document.getElementById('ratingModal').classList.add('active');
        }

        window.setRating = function(competency, rating) {
            event.target.parentElement.querySelectorAll('.rating-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            window.currentRatings[competency] = rating;
        };

        async function saveRating() {
            if (Object.keys(window.currentRatings || {}).length === 0) {
                alert('Por favor calificar al menos una competencia');
                return;
            }

            try {
                const ref = db.collection('candidates').doc(window.currentRatingDocId);
                const doc = await ref.get();
                const ratings = doc.data().ratings || {};
                ratings[window.currentRatingRaterName] = window.currentRatings;
                await ref.update({ ratings });
                closeRatingModal();
                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function openEditModal(docId) {
            const candidate = window.currentCandidates.find(c => c.id === docId);
            if (!candidate) return;

            document.getElementById('editCandidateName').textContent = candidate.name;
            document.getElementById('editName').value = candidate.name;
            document.getElementById('editEmail').value = candidate.email || '';
            document.getElementById('editPhone').value = candidate.phone || '';
            document.getElementById('editExperience').value = candidate.experience || 0;
            document.getElementById('editPms').value = candidate.pms || '';
            document.getElementById('editAvailability').value = candidate.availability || '';

            window.currentEditDocId = docId;
            closeModal();
            document.getElementById('editModal').classList.add('active');
        }

        async function saveEdit() {
            try {
                let photoUrl = '';
                let cvUrl = '';
                const photoFile = document.getElementById('editPhoto').files[0];
                const cvFile = document.getElementById('editCV').files[0];
                
                const candidate = window.currentCandidates.find(c => c.id === window.currentEditDocId);

                if (photoFile) {
                    const photoRef = storage.ref().child(`candidates/photos/${Date.now()}_${photoFile.name}`);
                    await photoRef.put(photoFile);
                    photoUrl = await photoRef.getDownloadURL();
                } else {
                    photoUrl = candidate.photoUrl || '';
                }

                if (cvFile) {
                    const cvRef = storage.ref().child(`candidates/cvs/${Date.now()}_${cvFile.name}`);
                    await cvRef.put(cvFile);
                    cvUrl = await cvRef.getDownloadURL();
                } else {
                    cvUrl = candidate.cvUrl || '';
                }

                await db.collection('candidates').doc(window.currentEditDocId).update({
                    name: document.getElementById('editName').value.trim(),
                    email: document.getElementById('editEmail').value.trim(),
                    phone: document.getElementById('editPhone').value.trim(),
                    experience: parseInt(document.getElementById('editExperience').value) || 0,
                    pms: document.getElementById('editPms').value.trim(),
                    availability: document.getElementById('editAvailability').value.trim(),
                    photoUrl: photoUrl,
                    cvUrl: cvUrl
                });

                closeEditModal();
                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function addCandidate() {
            const name = document.getElementById('newName').value.trim();
            if (!name) { alert('Ingrese el nombre'); return; }

            try {
                let photoUrl = '';
                let cvUrl = '';
                const photoFile = document.getElementById('newPhoto').files[0];
                const cvFile = document.getElementById('newCV').files[0];
                
                if (photoFile) {
                    const photoRef = storage.ref().child(`candidates/photos/${Date.now()}_${photoFile.name}`);
                    await photoRef.put(photoFile);
                    photoUrl = await photoRef.getDownloadURL();
                }

                if (cvFile) {
                    const cvRef = storage.ref().child(`candidates/cvs/${Date.now()}_${cvFile.name}`);
                    await cvRef.put(cvFile);
                    cvUrl = await cvRef.getDownloadURL();
                }

                await db.collection('candidates').add({
                    name,
                    email: document.getElementById('newEmail').value.trim(),
                    phone: document.getElementById('newPhone').value.trim(),
                    experience: parseInt(document.getElementById('newExperience').value) || 0,
                    pms: document.getElementById('newPms').value.trim(),
                    availability: document.getElementById('newAvailability').value.trim(),
                    cvUrl: cvUrl,
                    photoUrl: photoUrl,
                    vacante: window.currentVacancy,
                    round: 'round1',
                    ratings: {}
                });

                document.getElementById('newName').value = '';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPhone').value = '';
                document.getElementById('newExperience').value = '';
                document.getElementById('newPms').value = '';
                document.getElementById('newAvailability').value = '';
                document.getElementById('newCV').value = '';
                document.getElementById('newPhoto').value = '';

                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function deleteCandidate(docId) {
            if (!confirm('¿Eliminar este candidato?')) return;
            try {
                await db.collection('candidates').doc(docId).delete();
                loadVacancyDashboard(window.currentVacancy);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        function closeRatingModal() {
            document.getElementById('ratingModal').classList.remove('active');
        }

        window.addEventListener('popstate', router);
        initFirebase();
    </script>
</body>
</html>
